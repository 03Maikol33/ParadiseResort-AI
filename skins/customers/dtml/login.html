    <div class="single-slider hero-overly slider-height2 d-flex align-items-center" style="background-image: url('<[base]>/skins/customers/assets/img/hero/paradiseresort_banner.jpg'); background-size: cover; background-position: center;">
        <div class="container">
            <div class="row justify-content-center text-center">

                    <div class="h1-slider-caption">
                        <h1 data-animation="fadeInUp" data-delay=".4s">Accesso Riservato</h1>
                        <h3 data-animation="fadeInDown" data-delay=".4s">Ospiti & Staff ParadiseResort</h3>
                    </div>
                </div>

</div>

<section class="contact-section pt-80 pb-80">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow-lg border-0 rounded-lg p-5" style="background: #fff;">
                    <div class="text-center mb-4">
                        <h2 class="contact-title mb-2">Benvenuto al Resort</h2>
                        <p class="text-muted">Inserisci le tue credenziali per accedere al tuo account o al portale gestionale</p>
                    </div>

                    <[if!empty error]>
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i> <[error]>
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    <[/if!empty]>

                    <[if!empty message]>
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="fas fa-check-circle me-2"></i> <[message]>
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    <[/if!empty]>

                    <form class="form-contact contact_form" action="<[base]>/login.php" method="POST">
                        <div class="form-group mb-3">
                            <label class="font-weight-bold">Indirizzo Email</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text bg-light border-right-0"><i class="fas fa-envelope text-muted"></i></span>
                                </div>
                                <input class="form-control valid border-left-0" name="email" id="email" type="email" placeholder="nome@esempio.it" value="<[email_val]>" required autofocus>
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label class="font-weight-bold">Password</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text bg-light border-right-0"><i class="fas fa-lock text-muted"></i></span>
                                </div>
                                <input class="form-control valid border-left-0" name="password" id="password" type="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="form-group form-check mb-4 d-flex align-items-center">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember" value="1" style="width: 18px; height: 18px;">
                            <label class="form-check-label ml-2 pt-1 font-weight-bold text-dark" for="remember">Ricordami per 30 giorni</label>
                        </div>

                        <div class="form-group text-center mt-3">
                            <button type="submit" class="btn btn1 w-100 py-3" style="font-size: 1.1rem;">Accedi all'Area Personale</button>
                        </div>
                        
                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="mb-0 text-muted">Nuovo ospite? <a href="<[base]>/register.php" class="text-primary font-weight-bold">Registra un Account</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
